version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: lifeline-backend
    environment:
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your environment or a .env file}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: lifeline-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
